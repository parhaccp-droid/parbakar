    tb.onclick = function () { torch = !torch; track.applyConstraints({ advanced: [{ torch: torch }] }).catch(function () {}); };
    if ('BarcodeDetector' in window) {
      var det = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'data_matrix', 'qr_code', 'ean_8', 'itf', 'code_39', 'upc_a'] });

function barStop() {

// כשהאפליקציה ברקע – מכבים את המצלמה; כשחוזרים – מדליקים שוב
document.addEventListener('visibilitychange', function () {

});
/* ---- מכשיר כללי: תמיד יש דרך חזרה ----
   בזמן עובד (קוד עם ~) יש כפתור ⇄ גם בפס המצלמה (שייך לאפליקציית ההתקנה, עובד גם אם הדף שבפנים נתקע),
   ואם הדף לא עלה תוך 25 שניות – מסך עם "נסה שוב" / "חזרה למסך העובדים". */
var curU = typeof u === 'string' ? u : '', upT = null;
/* ---- כפתור "חזרה" של הטלפון: עובר לאפליקציה (חוזר מסך אחד אחורה). במסך הבית – לחיצה נוספת יוצאת ---- */
var backArmed = false;
function armBack() { if (backArmed) return; backArmed = true; try { history.pushState({ pb: 1 }, ''); } catch (x) {} }
window.addEventListener('popstate', function () {
  backArmed = false;
  if (ph.on) { phOff(true); return; }
  if (bar.on && !appWin) { barOff(); }
  if (appWin) appWin.postMessage({ pb: 'back' }, '*');

function devU() { var i = curU.indexOf('~'); return i > 0 ? curU.slice(0, i) : ''; }
function loadApp(nu) {
  try { barOff(); } catch (x) {}
  curU = nu; appWin = null; fresh = false;
  // מחליפים את כל המסגרת (ולא רק את הכתובת) – כדי שכפתור "חזרה" של הטלפון לא יחזיר לעובד/מסך קודם

  f.parentNode.replaceChild(nf, f); f = nf;

  document.getElementById('ksfail').style.display = 'none';

function appUp() { clearTimeout(upT); upT = null; document.getElementById('ksfail').style.display = 'none'; }
function appStuck() {
  var b = document.getElementById('ksfail'); b.style.display = 'block';
  document.getElementById('ksre').onclick = function () { loadApp(curU); };
  var bk = document.getElementById('ksbk'); bk.style.display = devU() ? '' : 'none';
  bk.onclick = function () { loadApp(devU()); };
}
document.getElementById('ksx').onclick = function () { if (devU() && confirm('לחזור למסך העובדים? סריקות שלא נשמרו יימחקו')) loadApp(devU()); };
document.getElementById('ksx').style.display = devU() ? '' : 'none';
function subscribe() {
  return navigator.serviceWorker.ready.then(function (reg) {
    return reg.pushManager.getSubscription().then(function (s) {
      return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
    });
  }).then(function (s) { mySub = JSON.parse(JSON.stringify(s)); tellApp(); }).catch(function () {});
}
function later() { try { localStorage.setItem('pb_push_later', String(Date.now())); } catch (e) {} }

if (u && canPush()) {
  if (Notification.permission === 'granted') subscribe();
  else if (Notification.permission === 'default' && !askedRecently()) setTimeout(function () {
    var bar = document.getElementById('pushbar'); bar.style.display = 'flex';
    document.getElementById('pbno').onclick = function () { bar.style.display = 'none'; later(); };
    document.getElementById('pbyes').onclick = function () {
      bar.style.display = 'none';
      Notification.requestPermission().then(function (p) { if (p === 'granted') subscribe(); else later(); });
    };
  }, 4000);
}

/* ---- צילום סחורה (אפי 27/11): המצלמה נשארת פתוחה, כל לחיצה מצלמת ושולחת לאפליקציה מיד.
   כל תמונה נשמרת קודם כאן במכשיר, ונמחקת רק כשהאפליקציה מאשרת שקיבלה – כך גם אם סוגרים את הטלפון באמצע לא הולך כלום. ---- */
var ph = { on: false, stream: null, n: 0, det: null };
function phDb(cb) {
  try { var r = indexedDB.open('pb_photos', 1); r.onupgradeneeded = function () { r.result.createObjectStore('p', { keyPath: 'id' }); }; r.onsuccess = function () { cb(r.result); }; r.onerror = function () { cb(null); }; } catch (e) { cb(null); }
}
function phPut(x) { phDb(function (db) { if (!db) return; try { db.transaction('p', 'readwrite').objectStore('p').put(x); } catch (e) {} }); }
function phAck(id) { phDb(function (db) { if (!db) return; try { db.transaction('p', 'readwrite').objectStore('p').delete(id); } catch (e) {} }); }
function phResend() {   // תמונות שלא אושרו (נסגר באמצע) – נשלחות שוב לאפליקציה כשהיא עולה
  phDb(function (db) {
    if (!db) return;
    try { var q = db.transaction('p').objectStore('p').getAll(); q.onsuccess = function () { (q.result || []).forEach(function (x) { if (appWin) appWin.postMessage({ pb: 'photo', id: x.id, img: x.img, codes: x.codes || [], at: x.at, again: 1 }, '*'); }); }; } catch (e) {}
  });
}
function phOn(label) {
  if (ph.on) return;
  ph.on = true; ph.n = 0; try { armBack(); } catch (e) {}
  var box = document.getElementById('ph'), v = document.getElementById('phv');
  box.style.display = 'block'; document.getElementById('phc').textContent = ''; document.getElementById('phth').style.display = 'none';
  if (label) document.getElementById('pht').textContent = label;
  document.getElementById('phx').onclick = function () { phOff(true); };
  document.getElementById('phs').onclick = phShot;
  v.onclick = phShot;
  if (!ph.det && 'BarcodeDetector' in window) { try { ph.det = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'data_matrix', 'qr_code', 'ean_8', 'itf', 'code_39', 'upc_a'] }); } catch (e) {} }

    ph.stream = st; v.srcObject = st; v.play();
    var track = st.getVideoTracks()[0], torch = false, tb = document.getElementById('phtorch');
    var caps = track.getCapabilities ? track.getCapabilities() : {};
    tb.style.display = caps.torch ? '' : 'none';
    tb.onclick = function () { torch = !torch; track.applyConstraints({ advanced: [{ torch: torch }] }).catch(function () {}); };
    autoFocus(track);
  }).catch(function () { alert('אין גישה למצלמה. יש לאשר הרשאת מצלמה לאפליקציה.'); phOff(true); });
}
function phShot() {
  var v = document.getElementById('phv'), w = v.videoWidth, h = v.videoHeight;
  if (!ph.on || !w) return;
  var k = Math.min(1, 1920 / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  var img = c.toDataURL('image/jpeg', 0.8), id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at = Date.now();
  try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  var fl = document.getElementById('phf'); fl.style.opacity = 0.7; setTimeout(function () { fl.style.opacity = 0; }, 90);
  var th = document.getElementById('phth'); th.src = img; th.style.display = 'block';
  ph.n++; document.getElementById('phc').textContent = '📷 ' + ph.n;
  var x = { id: id, img: img, codes: [], at: at };
  phPut(x);
  var send = function () { phPut(x); if (appWin) appWin.postMessage({ pb: 'photo', id: id, img: img, codes: x.codes, at: at }, '*'); };
  // ברקודים מהתמונה (אם הטלפון יודע לקרוא) – בלי לעכב את הצילום הבא
  if (ph.det) ph.det.detect(c).then(function (r) { x.codes = r.map(function (z) { return z.rawValue; }); }).catch(function () {}).then(send);
  else send();
}
function phOff(tell) {
  if (!ph.on) return;
  ph.on = false;
  if (ph.stream) ph.stream.getTracks().forEach(function (t) { t.stop(); });
  ph.stream = null; document.getElementById('ph').style.display = 'none';
  if (tell && appWin) appWin.postMessage({ pb: 'photosoff', n: ph.n }, '*');
}
document.addEventListener('visibilitychange', function () {   // נועלים את הטלפון – המצלמה נכבית; פותחים – ממשיכים לצלם
  if (!ph.on) return;
  if (document.hidden) { if (ph.stream) ph.stream.getTracks().forEach(function (t) { t.stop(); }); ph.stream = null; }
  else { var l = document.getElementById('pht').textContent, n = ph.n; ph.on = false; phOn(l); ph.n = n; if (n) document.getElementById('phc').textContent = '📷 ' + n; }
});
